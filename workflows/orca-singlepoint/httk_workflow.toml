# One ORCA single-point energy of one molecule: a small, complete workflow
# package to copy and edit. See run.py for what the step does.

[workflow]
name = "orca.singlepoint"
description = "one ORCA single-point energy of one molecule"
requires = ["httk-workflow>=2.1.1", "httk-workflow-orca>=0.1.0"]

[workflow.runner]
entry = "run.py"
steps = ["run"]
# The persistent workdir holds the result; collect.py reads orca.out from it.
data_mode = "none"

# A plain staged file: an .xyz molecule has no httk entry type.
[workflow.inputs.molecule]
destination = "molecule.xyz"
role = "molecule"
description = "The molecule as an .xyz file (count line, comment line, then symbol x y z in Angstrom)."
required = true

[workflow.parameters.keywords]
type = "string"
default = "B3LYP def2-SVP"
description = "The ORCA simple-input keywords (the ! line)."

[workflow.parameters.charge]
type = "integer"
default = 0
description = "The total charge."

[workflow.parameters.multiplicity]
type = "integer"
default = 1
description = "The spin multiplicity 2S+1."

[workflow.outputs.total_energy]
entry_type = "records"
role = "total_energy"
ref = "https://schemas.httk.org/defs/v0.1/properties/core/total_energy"
description = "The final single point energy of the molecule, in eV."

[workflow.collect]
file = "collect.py"
