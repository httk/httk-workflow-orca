# Recognizes a finished free-standing ORCA run: one <stem>.out with its <stem>.inp.

[workflow]
name = "orca.calculation"
description = "a finished ORCA calculation: one output file with its input beside it"

[workflow.recognize]
file = "recognize.py"
priority = 10
requires = ["*.out"]

[workflow.outputs.total_energy]
entry_type = "records"
role = "total_energy"
ref = "https://schemas.httk.org/defs/v0.1/properties/core/total_energy"
description = "The final single point energy of the calculation, in eV."

[workflow.collect]
file = "collect.py"
